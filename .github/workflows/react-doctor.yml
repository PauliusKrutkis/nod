name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/react-doctor.yml"
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: millionco/react-doctor@v2
        with:
          blocking: warning
          directory: apps/desktop
      # The action publishes counts — a commit status reading "5 errors" and a
      # job summary — but not which findings they are, so nobody can act on
      # the number without rerunning the scan by hand. This lists them, with
      # the same flags the action uses, into the job summary. It never fails
      # the job: the action above owns the verdict.
      - name: List the findings behind the score
        if: always()
        working-directory: apps/desktop
        run: |
          npx --yes react-doctor@latest --project '*' --json --json-compact \
            > "${RUNNER_TEMP}/react-doctor.json" || true
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { appendFileSync } from "node:fs";
            const path = `${process.env.RUNNER_TEMP}/react-doctor.json`;
            let report;
            try {
              report = JSON.parse(readFileSync(path, "utf8"));
            } catch {
              const miss = "React Doctor: no machine-readable report to list.\n";
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, miss);
              process.stdout.write(miss);
              process.exit(0);
            }
            const rows = report.diagnostics ?? [];
            const s = report.summary ?? {};
            const lines = [
              `### React Doctor findings`,
              "",
              `score ${s.score ?? "?"} · ${s.errorCount ?? 0} errors · ${s.warningCount ?? 0} warnings · ${rows.length} diagnostics`,
              "",
              "| severity | rule | file | line |",
              "| --- | --- | --- | --- |",
              ...rows.map((d) => `| ${d.severity} | ${d.plugin ?? "react-doctor"}/${d.rule} | ${d.id.split("::")[0]} | ${d.line} |`),
            ];
            const table = `${lines.join("\n")}\n`;
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, table);
            process.stdout.write(table);
          '

