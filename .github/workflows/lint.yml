# Ultracite (Biome) lint + format check, and Knip dead-code analysis. Both
# are repo-wide and finish in under a minute, so this workflow keeps no path
# filter — it is the one gate every PR runs.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ultracite:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Ultracite check
        run: pnpm check

  knip:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Knip
        run: pnpm knip
