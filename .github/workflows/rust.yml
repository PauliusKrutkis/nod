# Rust unit tests for the Tauri backend. Own workflow because the apt +
# toolchain setup costs a minute and nothing outside src-tauri can break it.
name: Rust

on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
