# Compares gallery screenshots against the committed linux baselines. The job
# is always red when the comparison fails, but it distinguishes the two
# reasons per test from Playwright's JSON report, judging each failing test
# by its FINAL attempt only (e2e/classify-shots.mjs): a cell that CHANGED
# gets its diffs published for review, while cells that are merely MISSING
# (every migration PR adds some) get generated and published as an artifact
# to commit — and a mixed run publishes both, so bootstrap never blocks
# behind unrelated diffs. The log is never grepped for the verdict: when a
# baseline is missing, Playwright writes the actual and the retry emits
# phantom "Screenshot comparison failed" lines, which used to misclassify
# missing-only runs as changed. Baselines are platform-suffixed, so the
# a local darwin render never stands in for this image — comparing across
# font-rendering stacks is pure noise. Only linux baselines are committed;
# darwin ones are gitignored and regenerate locally on demand. A visual change therefore only merges
# via an explicit baseline update, never by drifting silently.
#
# The suite runs 900+ cells on a single worker (parallel vite requests add
# frame latency and shots flake — see apps/gallery/playwright.config.ts), so
# it is sharded across machines instead: each shard keeps the one-worker
# invariant and the wall clock divides by the shard count. Shard baseline
# artifacts merge into one gallery-linux-baselines download at the end.
name: Gallery shots

on:
  pull_request:
    paths:
      - "packages/ui/**"
      - "packages/tokens/**"
      - "apps/gallery/**"
      - "apps/desktop/src/index.css"
      - "apps/desktop/src/quiet.css"
      - ".github/workflows/gallery-shots.yml"
      - ".github/actions/setup/**"
  workflow_dispatch:

concurrency:
  group: gallery-shots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shots:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browsers: webkit
      - name: Compare against linux baselines
        id: shots
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=shots-report.json \
            pnpm --filter @nod/gallery shots --shard=${{ matrix.shard }}/4 --reporter=line,json
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Classify the failures from the JSON report
        id: classify
        if: steps.shots.outputs.status != '0'
        run: node apps/gallery/e2e/classify-shots.mjs apps/gallery/shots-report.json >> "$GITHUB_OUTPUT"
      # Before the baseline generation below — that run wipes test-results.
      - name: Publish diffs for review
        if: ${{ !cancelled() && steps.shots.outputs.status != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: gallery-shot-diffs-shard-${{ matrix.shard }}
          path: |
            apps/gallery/test-results
            apps/gallery/shots-report.json
      # Regenerate on ANY red verdict, changed included: a changed-only shard
      # used to regenerate nothing, leaving no path to refresh a linux
      # baseline after an intended visual change (darwin regenerates from
      # shots:update locally; linux only has this job). Publishing is not merging — the
      # change still lands only when someone commits the artifact.
      # Stage ONLY what this shard regenerated: uploading the whole snapshot
      # dir made every shard's artifact carry stale copies of every OTHER
      # shard's cells, and the merge action's same-path conflicts then
      # clobbered one shard's fresh files with another's stale ones.
      - name: Generate the linux baselines this tree renders
        if: steps.classify.outputs.missing == 'true' || steps.classify.outputs.changed == 'true'
        run: |
          # A cell that fails even under --update-snapshots (e.g. the spec's
          # clock guard) must not abort staging: everything that DID
          # regenerate cleanly still gets published, and the failed cell
          # simply stays red for the next run.
          pnpm --filter @nod/gallery shots:update --shard=${{ matrix.shard }}/4 || true
          mkdir -p /tmp/shard-baselines
          git -C . diff --name-only -- 'apps/gallery/e2e/gallery.shots.ts-snapshots/*-linux.png' \
            | while read -r f; do cp "$f" /tmp/shard-baselines/; done
          git ls-files --others --exclude-standard -- 'apps/gallery/e2e/gallery.shots.ts-snapshots/*-linux.png' \
            | while read -r f; do cp "$f" /tmp/shard-baselines/; done
          ls /tmp/shard-baselines | wc -l
      - name: Publish the linux baselines to commit
        if: steps.classify.outputs.missing == 'true' || steps.classify.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gallery-linux-baselines-shard-${{ matrix.shard }}
          path: /tmp/shard-baselines/*-linux.png
      - name: Fail when the comparison did not pass
        if: steps.shots.outputs.status != '0'
        run: |
          if [ "${{ steps.classify.outputs.changed }}" = "true" ]; then
            echo "::error::A committed cell rendered differently. Review the"
            echo "::error::gallery-shot-diffs artifact; if the change is intended,"
            echo "::error::run shots:update locally and commit."
          fi
          if [ "${{ steps.classify.outputs.missing }}" = "true" ]; then
            echo "::error::New cells lack linux baselines. Download the"
            echo "::error::gallery-linux-baselines artifact and commit it."
          fi
          if [ "${{ steps.classify.outputs.changed }}" != "true" ] && [ "${{ steps.classify.outputs.missing }}" != "true" ]; then
            echo "::error::Gallery shots did not pass and no per-test verdict"
            echo "::error::was reached — read the job log and the diffs artifact."
          fi
          exit 1

  # Folds the per-shard baseline artifacts into the single download the shard
  # jobs' error message names. continue-on-error because the merge action
  # fails when no shard produced baselines, which is the common (green) case.
  merge-baselines:
    needs: shots
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Merge shard baselines
        continue-on-error: true
        uses: actions/upload-artifact/merge@v4
        with:
          name: gallery-linux-baselines
          pattern: gallery-linux-baselines-shard-*
          delete-merged: true
