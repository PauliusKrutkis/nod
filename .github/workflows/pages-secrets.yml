name: pages-secrets
on: workflow_dispatch
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: List Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages project list
