name: pages-secrets
on: workflow_dispatch
jobs:
  put:
    runs-on: ubuntu-latest
    steps:
      - name: Push Polar secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          POLAR_API_KEY: ${{ secrets.POLAR_API_KEY }}
        run: |
          printf '%s' "$POLAR_WEBHOOK_SECRET" | npx wrangler@4 pages secret put POLAR_WEBHOOK_SECRET --project-name pr-flow
          printf '%s' "$POLAR_API_KEY" | npx wrangler@4 pages secret put POLAR_API_KEY --project-name pr-flow
          npx wrangler@4 pages secret list --project-name pr-flow
