# Temporary probe for the v0.9.x AppImage failure: can the runner execute
# linuxdeploy's AppImage at all (FUSE), and what does it print when it
# fails? Delete after the release ships.
name: appimage-probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: fuse state
        run: |
          ldconfig -p | grep -i fuse || echo "NO libfuse in ldconfig"
          ls -la /usr/lib/x86_64-linux-gnu/libfuse* 2>/dev/null || echo "NO libfuse2 files"
          which fusermount fusermount3 || true
      - name: run linuxdeploy without extract-and-run
        run: |
          wget -q https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --version && echo "RUNS WITHOUT FUSE WORKAROUND" || echo "FAILED, exit $?"
      - name: run with extract-and-run
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage --version && echo "RUNS WITH EXTRACT_AND_RUN" || echo "STILL FAILED, exit $?"
