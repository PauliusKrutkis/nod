[package]
name = "nod"
version = "0.7.0"
description = "Nod — a keyboard-first, cache-first GitHub pull request reviewer"
authors = ["Paulius Krutkis"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# SSE answer streaming for ask-about-code (ai.rs): reqwest's bytes_stream is a
# futures Stream, and this is the standard adapter for consuming it.
futures-util = { version = "0.3", default-features = false }
url = "2"
tokio = { version = "1", features = ["rt", "time"] }
# Image diffs: file blobs are shipped to the webview as base64 data URLs.
base64 = "0.22"
# GitLab OAuth (PKCE): code-challenge hashing + verifier generation.
sha2 = "0.10"
# GitLab multi-line comment line_codes (sha1 of the file path).
sha1 = "0.10"
rand = "0.8"
dotenvy = "0.15"
# Auto-update. Nod is a desktop-only app, so this stays a plain dependency.
tauri-plugin-updater = "2"
# License token verification (Ed25519, offline) — see license.rs.
ed25519-dalek = "2"
# nod:// scheme — purchase activation now, "Open in Nod" extension later.
tauri-plugin-deep-link = "2"
# Reading the updater's release date for updates_until gating (update.rs).
time = "0.3"
# Repo snapshots: host archives are gzipped tarballs. flate2 defaults to the
# pure-Rust miniz_oxide backend, so this adds no C toolchain requirement.
flate2 = "1"
tar = "0.4"
tauri-plugin-notification = "2.3.3"
